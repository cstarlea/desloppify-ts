name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Run lint gate
        run: make lint

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Run typecheck gate
        run: make typecheck

  arch-contracts:
    name: arch-contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Run architecture contracts gate
        run: make arch

  ci-contracts:
    name: ci-contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Run CI contracts gate
        run: make ci-contracts

  tests-core:
    name: tests-core (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Run core tests
        run: make tests PYTEST_XML=pytest-core.xml
      - name: Upload core test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-core-report-${{ matrix.python-version }}
          path: pytest-core.xml

  tests-windows:
    name: tests-windows
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Run core tests
        run: make tests PYTEST_XML=pytest-windows.xml
      - name: Upload Windows test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-windows-report
          path: pytest-windows.xml

  tests-full:
    name: tests-full (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Run full tests (with optional deps)
        run: make tests-full PYTEST_XML=pytest-full.xml
      - name: Upload full test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-full-report-${{ matrix.python-version }}
          path: pytest-full.xml

  tests-golden-node:
    name: tests-golden-node
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desloppify/languages/typescript/tests/golden/node/package-lock.json
      - name: Run TypeScript golden scans with real tsc/knip
        run: make tests-golden-node

  package-smoke:
    name: package-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Run packaging smoke gate
        run: make package-smoke
      - name: Upload distribution artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dist-packages
          path: dist/
