[importlinter]
root_package = desloppify

[importlinter:contract:runtime_no_tests]
name = Runtime code does not import tests
type = forbidden
source_modules =
    desloppify.app
    desloppify.base
    desloppify.engine
    desloppify.intelligence
    desloppify.languages
forbidden_modules =
    desloppify.tests

[importlinter:contract:engine_no_app]
name = The engine does not import the app layer
type = forbidden
source_modules =
    desloppify.engine
forbidden_modules =
    desloppify.app

[importlinter:contract:languages_no_app]
name = Language plugins do not import the app layer
type = forbidden
source_modules =
    desloppify.languages
forbidden_modules =
    desloppify.app
ignore_imports =
    desloppify.languages.typescript.tests.** -> desloppify.app.**

[importlinter:contract:framework_facade]
name = The app and engine reach language internals only through languages.framework
type = forbidden
source_modules =
    desloppify.app
    desloppify.engine
forbidden_modules =
    desloppify.languages._framework
allow_indirect_imports = true
