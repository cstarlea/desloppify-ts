[importlinter]
root_package = desloppify_ts

[importlinter:contract:runtime_no_tests]
name = Runtime code does not import tests
type = forbidden
source_modules =
    desloppify_ts.app
    desloppify_ts.base
    desloppify_ts.engine
    desloppify_ts.intelligence
    desloppify_ts.languages
forbidden_modules =
    desloppify_ts.tests

[importlinter:contract:engine_no_app]
name = The engine does not import the app layer
type = forbidden
source_modules =
    desloppify_ts.engine
forbidden_modules =
    desloppify_ts.app

[importlinter:contract:languages_no_app]
name = Language plugins do not import the app layer
type = forbidden
source_modules =
    desloppify_ts.languages
forbidden_modules =
    desloppify_ts.app
ignore_imports =
    desloppify_ts.languages.typescript.tests.** -> desloppify_ts.app.**

[importlinter:contract:framework_facade]
name = The app and engine reach language internals only through languages.framework
type = forbidden
source_modules =
    desloppify_ts.app
    desloppify_ts.engine
forbidden_modules =
    desloppify_ts.languages._framework
allow_indirect_imports = true
